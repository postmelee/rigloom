[workspace]
members = ["crates/rigloom-core", "crates/rigloom-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }
wasm-bindgen = "=0.2.129"
